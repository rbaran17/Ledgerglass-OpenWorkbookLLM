# The web runtime serves static files only: accept HTTP, initiate nothing.
# Requires a CNI that enforces NetworkPolicy; otherwise it has no effect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledgerglass-web
spec:
  podSelector:
    matchLabels: {app: ledgerglass-web}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]
  egress: []

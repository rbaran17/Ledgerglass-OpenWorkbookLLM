apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerglass-web
  labels: {app: ledgerglass-web}
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: ledgerglass-web}
  template:
    metadata:
      labels: {app: ledgerglass-web}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: ledgerglass-web}
      containers:
        - name: web
          image: ledgerglass-workbook:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            - {name: FRAME_ANCESTORS, value: "'self'"}
            - {name: CONNECT_ORIGINS, value: ""}
            - {name: SHUTDOWN_TIMEOUT_MS, value: "10000"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          lifecycle:
            preStop:
              # Give endpoints/load balancers time to stop routing before SIGTERM.
              exec: {command: [node, -e, "setTimeout(() => {}, 5000)"]}

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  # Docker's internal DNS tracks replicas added with compose --scale web=N.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;
  upstream workbook {
    zone workbook 64k;
    least_conn;
    server web:8080 resolve;
    keepalive 16;
  }
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # Avoid workbook-related URLs, cookies and query strings in access logs.
  log_format minimal '{"status":$status,"duration":$request_time,"bytes":$body_bytes_sent}';
  access_log /dev/stdout minimal;
  server {
    listen 8080;
    client_max_body_size 1k;
    location / {
      proxy_pass http://workbook;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}

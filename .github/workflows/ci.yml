name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories surface without a code change.
    - cron: "17 14 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-tests:
    name: Web runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The runtime and its tests use Node built-ins only; no install is needed.
      - run: npm run test:deployment

  dependencies:
    name: Lockfile and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exactly what the lockfile records
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on high or critical advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests for the core model and the workers
        run: npm run test:unit
      - name: Type declarations match how the library and MCP server are used
        run: npm run test:types
      - name: Build the application from src/ with compressed assets
        run: npm run build:container
      - run: npx playwright install --with-deps chromium
      - name: Check the fresh build in a browser
        run: npm run test:e2e
        env:
          LEDGERGLASS_BUILD: dist-container
      - name: Build the library and mount it in a host page
        run: |
          npm run build:lib
          npm run test:lib

  containers:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the web and MCP images
        run: |
          docker build --target web -t ledgerglass-web .
          docker build --target mcp -t ledgerglass-mcp .
      - name: Web image starts read-only, reports ready and serves the application
        run: |
          docker run -d --name web --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 ledgerglass-web
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'
          docker rm -f web
      - name: MCP image serves its tools over stdio
        run: |
          docker run --rm ledgerglass-mcp --help | grep -q "Ledgerglass MCP server"
          docker run --rm -i --entrypoint node ledgerglass-mcp --input-type=module - < deploy/verify-mcp-image.mjs
